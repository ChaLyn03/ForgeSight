name: Compose Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compose-smoke.yml"
      - "apps/**"
      - "docker-compose.yml"
      - "ml/**"
      - "scripts/smoke_test.py"
      - ".dockerignore"

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install smoke dependencies
        run: python -m pip install requests pillow

      - name: Create local env
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          env = Path(".env")
          text = env.read_text()
          text = text.replace("SECRET_KEY=change-me-use-a-long-random-value", "SECRET_KEY=ci-smoke-secret-change-me")
          env.write_text(text)
          PY

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for health checks
        run: |
          for i in {1..60}; do
            docker compose ps
            if curl -fsS http://127.0.0.1:8000/health/ready && curl -fsS http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run deployment smoke test
        run: python scripts/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
