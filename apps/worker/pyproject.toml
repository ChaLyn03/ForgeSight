[tool.poetry]
name = "forgesight-worker"
version = "0.1.0"
description = "ForgeSight worker"
authors = ["ForgeSight"]

[tool.poetry.dependencies]
python = "^3.11"
dramatiq = "^1.36"
redis = "^4.7"
requests = "^2.31"
pandas = "^2.0"
mlflow = "^2.6"
onnxruntime = "^1.16"
numpy = "^2.0"
torch = "^2.1"
forgesight-api = { path = "../api" }

[tool.poetry.dev-dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
